name: Build Spam Buff (Android64)
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
jobs:
  build:
    name: Android 64-bit
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
      - name: Upload .geode file
        uses: actions/upload-artifact@v4
        with:
          name: Spam-Buff-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error